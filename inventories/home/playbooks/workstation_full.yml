---
- import_playbook: desktop_full.yml

- name: Configure workstation (full)
  hosts: all
  become: true

  roles:
    # odem.optimize
    - odem.optimize.zram
    - odem.optimize.ramdisks
    - odem.optimize.kmscon

    # odem.development
    - odem.development.opencode
